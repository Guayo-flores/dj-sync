[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-sync"
version = "0.1.0"
description = "Local-first Spotify-to-TIDAL playlist synchronization for DJs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dj-sync = "dj_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
